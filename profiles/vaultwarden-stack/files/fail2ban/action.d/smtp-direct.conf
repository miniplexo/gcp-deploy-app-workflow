[Definition]

# Executed when Fail2ban bans an IP.
# Mail goes straight to the SMTP provider: STARTTLS is required (--ssl-reqd) and curl logs in with the
# SMTP credentials. The envelope sender is the address <sender>; <sendername> is only the display name.
actionban = ( \
  printf "From: <sendername> <<sender>>\nTo: <destemail>\nSubject: [Fail2Ban] <name>: Banned <ip>\n\nIP <ip> was banned after <failures> failed attempts against <name>.\n" | \
  curl -s --ssl-reqd --url "smtp://${SMTP_HOST}:${SMTP_PORT}" \
       --user "${SMTP_USERNAME}:${SMTP_PASSWORD}" \
       --mail-from "<sender>" \
       --mail-rcpt "<destemail>" \
       --upload-file - \
  )

actionstop = 
actionstart = 
actionunban = 

[Init]
name = default
destemail = ${fail2ban_email_recipient}
sender = ${fail2ban_email_sender}
sendername = ${fail2ban_email_sendername}
